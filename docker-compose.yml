version: '3.8'

services:
  web:
    build: .
    container_name: framasa_backend
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
      - ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - framasa_network

volumes:
  static_volume:

networks:
  framasa_network:
    driver: bridge

